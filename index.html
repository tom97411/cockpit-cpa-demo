<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpit CPA Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#17334d;font:15px system-ui}header{background:#163b60;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:16px}section{background:white;border-radius:12px;padding:18px;margin:12px 0;overflow:auto}button,select,input,textarea{font:inherit;padding:9px;border:1px solid #aabaca;border-radius:6px;margin:4px}button{background:#1768a2;color:white;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}textarea{width:100%}nav{display:flex;flex-wrap:wrap}pre{white-space:pre-wrap}small{color:#52677a}</style><header><h1>Cockpit CPA — Démonstration</h1>Simulation publique · données fictives · aucun envoi réel</header><main><nav id="nav"></nav><section id="view"></section></main><script>
const tabs=['Graphiques','Suivi OE','INFORESEAU','Annuaire','Communications'];let current=tabs[0],history=[],provider='Michel',scope='BI Saint-Pierre',selected=new Set(),contacts={Michel:'michel@example.invalid','Prestataire B':'contact@example.invalid'},rows=Array.from({length:8},(_,i)=>({id:'DEMO-'+(101+i),bi:i<3?'BI Saint-Pierre':i<6?'BI Saint-Leu':'BI Le Port',ai:i<6?'AI Sud':'AI Nord',p:i===7?'Prestataire B':'Michel',origin:'Prestataire',reason:'Retard',comment:'',date:'2026-11-20'}));const v=document.querySelector('#view');function el(tag,text,parent){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e}function btn(t,f,p=v){let b=el('button',t,p);b.onclick=f;return b}function select(values,value,f,p=v){let s=el('select',undefined,p);values.forEach(x=>{let o=el('option',x,s);o.value=x});s.value=value;s.onchange=()=>f(s.value);return s}function table(headers,p=v){let t=el('table',undefined,p),r=t.insertRow();headers.forEach(x=>el('th',x,r));return t}function cell(r,x){return el('td',x,r)}function show(tab){current=tab;v.replaceChildren();el('h2',tab,v);if(tab==='Suivi OE'){select(['BI Saint-Pierre','BI Saint-Leu','BI Le Port','AI Sud','AI Nord'],scope,x=>{scope=x;selected.clear();show(tab)});select(Object.keys(contacts),provider,x=>{provider=x;selected.clear();show(tab)});let list=rows.filter(r=>r.p===provider&&(r.bi===scope||r.ai===scope));btn('Tout sélectionner',()=>{selected=new Set(list.map(r=>r.id));show(tab)});let t=table(['Choix','OE','BI','Origine','Motif','Commentaire']);list.forEach(r=>{let tr=t.insertRow(),c=el('input',undefined,cell(tr));c.type='checkbox';c.checked=selected.has(r.id);c.onchange=()=>{c.checked?selected.add(r.id):selected.delete(r.id);prepare.disabled=!selected.size};cell(tr,r.id);cell(tr,r.bi);select(['Prestataire','Technique','Organisation','Client'],r.origin,x=>r.origin=x,cell(tr));select(['Retard','Matériel indisponible','Accès','Autre'],r.reason,x=>r.reason=x,cell(tr));let a=el('textarea',undefined,cell(tr));a.value=r.comment;a.oninput=()=>r.comment=a.value});let prepare=btn('Préparer la relance',()=>{let chosen=list.filter(r=>selected.has(r.id));preview(scope+' – Relance '+provider+' – '+chosen.length+' OE en écart – '+new Date().toLocaleDateString('fr-FR'),contacts[provider],chosen.map(r=>[r.id,r.bi,r.date,r.origin,r.reason,r.comment].join(' | ')).join('\n'),'Suivi OE')});prepare.disabled=!selected.size}else if(tab==='INFORESEAU'){el('p','Affaire fictive DEMO-IR-01 · consignation à communiquer',v);let dest=select(['Chefs d’agence','Préparateur'],'Chefs d’agence',()=>{});btn('Préparer information',()=>preview('Information réseau – DEMO-IR-01',dest.value==='Chefs d’agence'?'agence@example.invalid':'preparateur@example.invalid','Consignation fictive à confirmer.','INFORESEAU'))}else if(tab==='Annuaire'){Object.keys(contacts).forEach(p=>{el('h3',p,v);let a=el('input',undefined,v);a.value=contacts[p];a.readOnly=true});el('p','Adresses de simulation non modifiables sur ce site public.',v)}else if(tab==='Communications'){let t=table(['Date','Module','Objet','Statut']);history.forEach(h=>{let r=t.insertRow();h.forEach(x=>cell(r,x))})}else{el('p','Exploration de volumes fictifs',v);let level=0,active=new Set(['Maintenance','Ingénierie']),compare=false;let chart=el('div',undefined,v);function draw(){chart.replaceChildren();el('h3',['Année 2026','Novembre','Semaine du 16','Jour du 16'][level],chart);['Maintenance','Ingénierie'].forEach(x=>btn((active.has(x)?'✓ ':'')+x,()=>{active.has(x)?active.delete(x):active.add(x);draw()},chart));btn(compare?'Masquer comparaison':'Comparer période précédente',()=>{compare=!compare;draw()},chart);let n=active.size*12/(level+1);el('p','Volume : '+n.toFixed(1)+' j-agent'+(compare?' · évolution simulée +10 %':''),chart);let bar=el('div',undefined,chart);bar.style.cssText='background:#1768a2;height:24px;width:'+n/24*100+'%';btn('Détail période',()=>{level=Math.min(3,level+1);draw()},chart);btn('Retour',()=>{level=Math.max(0,level-1);draw()},chart)}draw();el('h3','Prévisionnel / réalisé — exemple',v);el('p','450 j / 420 j · écart -30 j (-6,7 %)',v);el('h3','Pareto — exemple',v);el('p','Accès 40 % · Client 30 % · Matériel 20 % · Autres 10 %',v)}}function preview(subject,to,body,module){let s=el('section',undefined,v);el('h3','Aperçu — aucun envoi réel',s);el('p','À : '+to,s);el('strong',subject,s);el('pre','Bonjour,\nMerci de nous transmettre un retour :\n'+body+'\nCordialement.',s);btn('Simuler confirmation',()=>{history.push([new Date().toLocaleString('fr-FR'),module,subject,'Simulation uniquement']);show('Communications')},s)}tabs.forEach(t=>btn(t,()=>show(t),document.querySelector('#nav')));show(current);
</script></html>
